server:
  port: 9900

spring:
  application:
    name: api-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      routes:
        # -------------------------- auth 服务路由（修复后）--------------------------
        - id: gate-service-route
          uri: lb://gate-service
          predicates:
            # 匹配 /auth/** 或 /config/** 开头的请求
            - Path=/auth/**, /config/**
          filters:
            # 动态剥离第一级路径（无论是 /auth 还是 /config）
            - RewritePath=^/(?:auth|config)/(.*)$, /$1

        # -------------------------- job 服务路由（同理修复）--------------------------
        - id: job-service-route
          uri: lb://job-service
          predicates:
            - Path=/job/**
          filters:
            - RewritePath=^/job/(.*)$, /$1

        # -------------------------- mq 服务路由（同理修复）--------------------------
        - id: mq-service-route
          uri: lb://mq-service
          predicates:
            - Path=/mq/**
          filters:
            - RewritePath=^/mq/(.*)$, /$1

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,routes # 暴露健康检查端点
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true # 启用Nacos需要的健康探测端点
  health:
    nacos:
      enabled: true # 启用Nacos健康检查适配